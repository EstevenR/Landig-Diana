<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--red:#C8102E;--rose:#E8577A;--line:#F4A6BB;--muted:#9C6B78;--ink:#4A2E35;color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(18px,2.2vw,21px);line-height:1.6}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#lock{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#FFF3F6,transparent 65%)}
.lock-card{width:min(92vw,380px)}
.lock-icon{width:86px;height:86px;margin:0 auto 10px;display:block}
.lock-icon .shackle{transition:transform .5s ease;transform-origin:70% 100%}
#lock.ok .lock-icon .shackle{transform:translateY(-8px) rotate(-25deg)}
h1{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(2.4rem,9vw,3.2rem);line-height:1.05;margin:0 0 .2em;color:var(--red)}
p{color:var(--muted);margin:0 0 18px}
form{display:flex;flex-direction:column;gap:12px;align-items:center}
#pass{width:100%;max-width:260px;text-align:center;font-family:"Caveat",cursive;font-size:2rem;letter-spacing:.06em;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
#pass::placeholder{color:#E6A3B4}
.btn-red{background:var(--red);color:#fff;border:none;padding:10px 28px;border-radius:999px;font-family:"Caveat",cursive;font-size:1.5rem;font-weight:700;box-shadow:0 5px 0 #7A0A1C}
.btn-red:active{transform:translateY(3px);box-shadow:0 2px 0 #7A0A1C}
.btn-red:disabled{opacity:.7}
#lockMsg{min-height:1.6em;font-family:"Caveat",cursive;font-size:1.35rem;color:var(--red);margin-top:6px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.particle{position:fixed;pointer-events:none;z-index:80;font-size:22px}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<div id="lock">
  <div class="lock-card" id="lockCard">
    <svg class="lock-icon" viewBox="0 0 64 64" aria-hidden="true">
      <path class="shackle" d="M20 28v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#C8102E" stroke-width="6" stroke-linecap="round"/>
      <rect x="12" y="28" width="40" height="30" rx="7" fill="#E8577A"/>
      <path d="M32 50s-7-4.3-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 39 41c0 4.7-7 9-7 9z" fill="#fff"/>
    </svg>
    <h1>Esto es solo para ti</h1>
    <p>Escribe la fecha en que empezó lo nuestro</p>
    <form id="lockForm" autocomplete="off">
      <input id="pass" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" aria-label="Fecha en formato día, mes y año">
      <button type="submit" class="btn-red" id="openBtn">Abrir</button>
    </form>
    <div id="lockMsg" aria-live="polite"></div>
  </div>
</div>

      const p = document.createElement('span'); p.className = 'particle'; p.textContent = icons[i % icons.length];
      p.style.left = x + 'px'; p.style.top = y + 'px'; document.body.append(p);
      const a = Math.random()*Math.PI*2, d = 80 + Math.random()*160;
      p.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-60}px)) scale(1.2)`,opacity:0}],{duration:1400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove();
    }
  }
  async function abrir(clave){
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.iv)}, key, b64(DATA.ct));
    return new TextDecoder().decode(out);
  }
  document.getElementById('lockForm').addEventListener('submit', async e => {
    e.preventDefault(); if (busy) return;
    let d = pass.value.replace(/\D/g,'');
    if (d.length === 6) d = d.slice(0,4) + '20' + d.slice(4);
    if (!window.crypto || !crypto.subtle){ msg.textContent = 'Ábrelo desde el enlace (https) para que funcione 🔒'; return; }
    busy = true; btn.disabled = true; btn.textContent = 'Abriendo…'; msg.textContent = '';
    try {
      const html = await abrir(d);
      document.getElementById('lock').classList.add('ok');
      msg.textContent = 'Sabía que no se te olvidaba 🥰';
      const r = document.querySelector('.lock-icon').getBoundingClientRect();
      burst(r.left + r.width/2, r.top + r.height/2, 20);
      pass.blur();
      setTimeout(() => { document.open(); document.write(html); document.close(); }, 1300);
    } catch (err) {
      msg.textContent = frases[Math.min(fallos, frases.length-1)]; fallos++;
      const c = document.getElementById('lockCard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      busy = false; btn.disabled = false; btn.textContent = 'Abrir'; pass.select();
    }
  });
})();
</script>
